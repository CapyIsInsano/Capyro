[package]
name = "capyro_gui"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Interfaz gráfica de Capyro (egui) — se compila como staticlib y se linkea al núcleo en C"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
