[package]
name = "capyro_gui"
version = "0.4.0"
edition = "2021"
rust-version = "1.95"
description = "Interfaz gráfica de Capyro (egui) — se compila como staticlib y se linkea al núcleo en C"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

# Lo que es de un solo sistema se compila solo en ese sistema: en Linux no
# entra nada de Windows ni de la Mac (y al revés).
[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# Diálogo nativo para abrir archivos (en Linux usa el portal de escritorio)
rfd = "0.17"
pollster = "0.4"
# Ver los bytes RGBA de un cuadro como píxeles de egui sin copiarlos de a uno
bytemuck = "1"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
# Actualizador: prioridad baja para la compilación, kill() y flock()
libc = "0.2"
# Solo para elegir el backend X11/Wayland en Linux (misma versión que usa eframe)
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }
# Segundo plano: el ícono en la bandeja (StatusNotifierItem por D-Bus; Rust
# puro, sin librerías del sistema)
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
# wgpu (Direct3D 12) además de OpenGL: si la placa no tiene OpenGL, se usa esto
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
# Carpetas conocidas de Windows (Documentos, Imágenes, AppData), aunque
# estén movidas a OneDrive u otro disco.
dirs = "6"
# Actualizador: lee las respuestas de la API de GitHub (Releases)
serde_json = "1"
# Segundo plano: el ícono en la bandeja (Shell_NotifyIcon)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal (wgpu) además de OpenGL: Apple dejó OpenGL de lado, Metal es lo de la Mac
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
# Actualizador: lee las respuestas de la API de GitHub (Releases)
serde_json = "1"
# Lo de la Mac que no trae winit: abrir archivos desde el Finder, el ícono
# en la barra de menús (segundo plano), mover Capyro a la Papelera. Las
# mismas versiones que ya usan rfd y winit (no agregan nada al compilar).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDate",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }

[dev-dependencies]
# Las pruebas del actualizador de Windows corren en cualquier sistema
serde_json = "1"

# ---------------------------------------------------------------------------
# Perfiles de compilación
#
# release → el de siempre (cmake --build). Todo optimizado (-O3), pero sin LTO:
#           la primera vez compila las dependencias y después, si cambiás algo
#           de la GUI, recompila en segundos en vez de más de un minuto.
# dist    → cmake -DCAPYRO_DIST=ON. LTO completo: binario ~15 % más chico,
#           para empaquetar o instalar. Tarda bastante más en compilar.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = true
debug = false
strip = true

# Scripts de build y macros (syn, serde_derive, ...): corren una vez al
# compilar y nunca dentro de Capyro, no vale la pena optimizarlos.
[profile.release.build-override]
opt-level = 0
codegen-units = 256
debug = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
